name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 最小权限：只需读仓库内容，绝不授予写/管理权限
permissions:
  contents: read

# 每个 PR 会运行 3 个独立 job（各含 Windows + Linux 两个矩阵变体），
# 每个矩阵变体的 job 名就是 GitHub 必需状态检查名，例如：
#   syntax / py-compile (windows-latest)
#   syntax / py-compile (ubuntu-latest)
#   unit / tests (windows-latest)
#   unit / tests (ubuntu-latest)
#   gate / run-all (windows-latest)
#   gate / run-all (ubuntu-latest)
# 在 Settings → Branches → Main → "Require status checks" 中勾选全部 6 项。
# Windows 变体专项覆盖 GBK 控制台 / PowerShell 管道 / 中文路径三类坑。

jobs:
  # ==========================================================================
  # 1. 语法检查（全量 .py 编译，双平台矩阵）
  # ==========================================================================
  syntax-check:
    name: "syntax / py-compile"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Compile all Python scripts
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 用 compileall 一次编译全量 .py（任一文件失败即非零退出）。
          # 不再手工拼接 $f.FullName 嵌入 python -c —— Windows 绝对路径里的
          # 反斜杠（\t \v \U 等）会被 Python 字符串转义，中文路径还会引入
          # 控制台编码问题，两种坑都属于「本地绿、CI 红」的隐形来源。
          python -m compileall -q -f tools/scripts
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Python compile FAILED (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "All Python scripts compiled OK"

  # ==========================================================================
  # 2. 单元测试（双平台矩阵）
  # ==========================================================================
  unit-tests:
    name: "unit / tests"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # chapter_policy 单元测试（退出码非零即失败）
          python tools/scripts/tests/test_chapter_policy.py -v
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unit tests FAILED (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Unit tests PASSED"

  # ==========================================================================
  # 3. 章节门禁（等价于 pre-commit hook，不含 HTTP 校验；双平台矩阵）
  # ==========================================================================
  chapter-gate:
    name: "gate / run-all"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run unified gate
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 不解析 stdout JSON（多行 JSON 经 PowerShell 管道逐行解析会失败），
          # 以 run_all.py 退出码为权威判据（0=通过，1=失败），JSON 落盘供查看。
          python tools/scripts/validation/run_all.py --json --json-file=gate_report.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gate FAILED (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Gate PASSED"

      - name: Index drift check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 工具卡索引统计漂移检查（新增/改评卡片后未更新 README 统计即失败）
          python tools/scripts/quality/更新工具索引.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Index drift detected — run: python tools/scripts/quality/更新工具索引.py"
            exit 1
          }
          Write-Host "Index stats consistent"

      - name: Retrieval baseline check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 检索基准回归检查（保证脚本可跑，基线值变化时人工确认）
          python tools/scripts/quality/检索基准.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Retrieval baseline check FAILED"
            exit 1
          }
          Write-Host "Retrieval baseline OK"

      # 仅 Windows 变体：GBK 控制台 / PowerShell 管道 / 中文路径专项验证
      # （Linux 变体天然 UTF-8，无需此项；这是「Windows 负责三坑」的落地点）
      - name: Windows native checks (GBK / PowerShell / 中文路径)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 1) _runtime.ps1 必须在 PowerShell 下解析出受管 Python 与中文根路径
          . "./maintenance/scripts/_runtime.ps1" 6>$null
          if (-not $Script:Python -or -not (Test-Path $Script:Python)) {
            Write-Error "_runtime 未解析到有效 Python: $Script:Python"
            exit 1
          }
          if ($Script:Root -notmatch '个人知识库') {
            Write-Error "_runtime Root 未解析到中文路径: $Script:Root"
            exit 1
          }
          Write-Host "_runtime OK: $Script:Python"

          # 2) 中文路径 + PowerShell 管道：门禁 JSON 落盘后必须可被 ConvertFrom-Json 解析
          #    （模拟 daily-backup 的 gate 阶段；GBK 解码污染会在这一步暴露）
          python tools/scripts/validation/run_all.py --json --json-file=win-gate.json
          if ($LASTEXITCODE -ne 0) { Write-Error "win gate FAILED"; exit 1 }
          $data = Get-Content win-gate.json -Raw | ConvertFrom-Json
          if (-not $data.summary.overall_pass) { Write-Error "win gate JSON parse OK but not pass"; exit 1 }
          Write-Host "Windows native checks PASSED (GBK/PowerShell/中文路径)"

      - name: Gate summary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          if (Test-Path gate_report.json) {
            $data = Get-Content gate_report.json -Raw | ConvertFrom-Json
            $basic = $data.summary.basic
            $core = $data.summary.'core_broken_links'
            Write-Host "  basic:        $($basic.errors) errors / $($basic.warns) warns"
            Write-Host "  core-links:   $($core.errors) errors"
            Write-Host "  overall:      $($data.summary.overall_pass)"
          } else {
            Write-Host "  gate_report.json 未生成"
          }
