name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 每个 PR 会运行 3 个独立 job，每个 job 名就是 GitHub 必需状态检查名。
# 在 Settings → Branches → Main → "Require status checks" 中勾选即可。

jobs:
  # ==========================================================================
  # 1. 语法检查（全量 .py 编译）
  # ==========================================================================
  syntax-check:
    name: "syntax / py-compile"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Compile all Python scripts
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $bad = 0
          $ok = 0
          $files = Get-ChildItem -Recurse -Path tools/scripts -Filter *.py |
                   Where-Object { $_.FullName -notmatch '__pycache__' }
          foreach ($f in $files) {
            try {
              # 用 forward-slash 路径避免 Python -c 中反斜杠转义（\t \n \a 等）
              $pyPath = $f.FullName -replace '\\', '/'
              python -c "import py_compile; py_compile.compile('$pyPath', doraise=True)"
              $ok++
            } catch {
              Write-Host "FAIL: $($f.Name)"
              $bad++
            }
          }
          Write-Host "$ok/$($files.Count) OK"
          if ($bad -gt 0) { Write-Error "$bad files failed compilation"; exit 1 }

  # ==========================================================================
  # 2. 单元测试
  # ==========================================================================
  unit-tests:
    name: "unit / tests"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run unit tests
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # chapter_policy 单元测试（退出码非零即失败）
          python tools/scripts/tests/test_chapter_policy.py -v
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Unit tests FAILED (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Unit tests PASSED"

  # ==========================================================================
  # 3. 章节门禁（等价于 pre-commit hook，不含 HTTP 校验）
  # ==========================================================================
  chapter-gate:
    name: "gate / run-all"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run unified gate
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 不解析 stdout JSON（多行 JSON 经 PowerShell 管道逐行解析会失败），
          # 以 run_all.py 退出码为权威判据（0=通过，1=失败），JSON 落盘供查看。
          python tools/scripts/validation/run_all.py --json --json-file=gate_report.json
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Gate FAILED (exit $LASTEXITCODE)"
            exit 1
          }
          Write-Host "Gate PASSED"

      - name: Index drift check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 工具卡索引统计漂移检查（新增/改评卡片后未更新 README 统计即失败）
          python tools/scripts/quality/更新工具索引.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Index drift detected — run: python tools/scripts/quality/更新工具索引.py"
            exit 1
          }
          Write-Host "Index stats consistent"

      - name: Retrieval baseline check
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # 检索基准回归检查（保证脚本可跑，基线值变化时人工确认）
          python tools/scripts/quality/检索基准.py --check
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Retrieval baseline check FAILED"
            exit 1
          }
          Write-Host "Retrieval baseline OK"

      - name: Gate summary
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          if (Test-Path gate_report.json) {
            $data = Get-Content gate_report.json -Raw | ConvertFrom-Json
            $basic = $data.summary.basic
            $core = $data.summary.'core_broken_links'
            Write-Host "  basic:        $($basic.errors) errors / $($basic.warns) warns"
            Write-Host "  core-links:   $($core.errors) errors"
            Write-Host "  overall:      $($data.summary.overall_pass)"
          } else {
            Write-Host "  gate_report.json 未生成"
          }
