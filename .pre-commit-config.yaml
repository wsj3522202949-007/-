# Pre-commit 门禁配置
# 每次提交前自动运行知识库质量校验
# 安装: pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: knowledge-base-validator
        name: 知识库质量门禁
        entry: python tools/scripts/maintenance/提交前校验.py --core-only
        language: system
        types: [markdown]
        pass_filenames: false
        always_run: true
        description: 运行统一门禁校验（frontmatter/结构/旧路径/断链/编码）
