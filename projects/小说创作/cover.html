<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说封面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
        }
        
        .book-cover {
            width: 400px;
            height: 600px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        
        .book-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.1)"/></svg>') no-repeat center;
            background-size: cover;
            opacity: 0.3;
        }
        
        .title {
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            z-index: 1;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            text-align: center;
            z-index: 1;
            margin-bottom: 30px;
        }
        
        .author {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            position: absolute;
            bottom: 30px;
            z-index: 1;
        }
        
        .decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            top: -30px;
            right: -30px;
        }
        
        .decoration2 {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            bottom: 50px;
            left: -20px;
        }
        
        .genre {
            background: rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="book-cover">
        <div class="decoration"></div>
        <div class="decoration2"></div>
        <div class="genre">重生 · 甜宠 · 打脸逆袭</div>
        <div class="title">重生后，前夫跪着求复合</div>
        <div class="subtitle">这一世，我要让所有伤害过我的人付出代价</div>
        <div class="author">七猫小说</div>
    </div>
</body>
</html>
